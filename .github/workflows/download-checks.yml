name: Download compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOWNLOAD_AUTO_UPDATE: 'false'
      DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run --frozen python -m unittest discover -s tests -v
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Check the current nightly adapter
        working-directory: backend
        run: |
          uv pip install --python .venv/bin/python --upgrade --prerelease allow 'yt-dlp[default]'
          .venv/bin/python app/services/download_runner.py --self-test
          .venv/bin/python -m unittest discover -s tests -v
